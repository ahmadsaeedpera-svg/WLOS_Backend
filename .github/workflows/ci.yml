name: CI

# Runs on every push and pull request. Before this existed, nothing ran the
# tests except a developer remembering to — which is how the audit-column
# contract sat at 0/43 compliance without anybody noticing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same branch. No value in
  # finishing a build for a commit nobody will deploy.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # A CI machine downloads packages once per job; the telemetry and the
  # first-run banner are noise in the log.
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The integration tests run against a real SQL Server, deliberately.
      # Every rule that matters in this platform lives in a stored procedure;
      # a suite that mocks the repository verifies the mocks and cannot tell
      # you whether an editor can publish something nobody approved.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD || 'Local!CI!Passw0rd#2026' }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD || 'Local!CI!Passw0rd#2026' }}
      SQLCMD: /opt/mssql-tools18/bin/sqlcmd

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install sqlcmd
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            if $SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "SQL Server did not become ready"; exit 1

      - name: Create database
        run: $SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -Q "CREATE DATABASE MarenPlatform"

      - name: Apply schema
        # Order matters and every script is idempotent. A failure here stops the
        # job rather than letting later scripts fail confusingly against a
        # half-built schema.
        working-directory: src/Maren.Database
        run: |
          set -e
          for f in 01_Schemas.sql 02_Identity.sql 03_Administration.sql 04_Health.sql \
                   05_Content_Notifications_Audit.sql 06_CMS.sql 07_Access.sql \
                   08_AuditContract.sql 14_Procs_Config.sql \
                   10_Procs_Administration.sql 11_Procs_Identity.sql \
                   12_Procs_Content.sql 13_Procs_Access.sql \
                   15_Procs_ContentDelta.sql 16_ContentTaxonomy.sql \
                   20_Seed.sql 21_Seed_CMS.sql 22_Seed_FAQ.sql \
                   30_Indexes_ForeignKeys.sql 31_AI_Safety.sql \
                   32_LifeStage.sql 33_Procs_Profile.sql \
                   34_ContentTargeting.sql 35_Procs_ContentTargeting.sql \
                   36_Timeline.sql 37_Procs_Timeline.sql \
                   38_LifeDomain.sql 39_KnowledgeGraph.sql 40_Procs_Knowledge.sql \
                   41_Dashboard.sql 42_Procs_Dashboard.sql \
                   43_Intelligence.sql 44_Procs_Intelligence.sql \
                   45_RuleEngine.sql 46_Procs_RuleEngine.sql 47_Procs_Inspector.sql \
                   49_Behaviour.sql 50_Procs_Behaviour.sql \
                   52_Growth_Goals.sql 53_Procs_Growth_Goals.sql \
                   54_AuditContract_Apply.sql; do
            echo "--- $f"
            $SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i "$f" -b
          done

      - name: Verify schema applies from scratch a second time
        # Proves idempotency. Every script claims to be re-runnable; this is
        # what makes the claim true rather than aspirational.
        working-directory: src/Maren.Database
        run: |
          set -e
          for f in 01_Schemas.sql 02_Identity.sql 03_Administration.sql 04_Health.sql \
                   05_Content_Notifications_Audit.sql 06_CMS.sql 07_Access.sql \
                   08_AuditContract.sql 14_Procs_Config.sql \
                   10_Procs_Administration.sql 11_Procs_Identity.sql \
                   12_Procs_Content.sql 13_Procs_Access.sql \
                   15_Procs_ContentDelta.sql 16_ContentTaxonomy.sql \
                   20_Seed.sql 21_Seed_CMS.sql 22_Seed_FAQ.sql \
                   30_Indexes_ForeignKeys.sql 31_AI_Safety.sql \
                   32_LifeStage.sql 33_Procs_Profile.sql \
                   34_ContentTargeting.sql 35_Procs_ContentTargeting.sql \
                   36_Timeline.sql 37_Procs_Timeline.sql \
                   38_LifeDomain.sql 39_KnowledgeGraph.sql 40_Procs_Knowledge.sql \
                   41_Dashboard.sql 42_Procs_Dashboard.sql \
                   43_Intelligence.sql 44_Procs_Intelligence.sql \
                   45_RuleEngine.sql 46_Procs_RuleEngine.sql 47_Procs_Inspector.sql \
                   49_Behaviour.sql 50_Procs_Behaviour.sql \
                   52_Growth_Goals.sql 53_Procs_Growth_Goals.sql \
                   54_AuditContract_Apply.sql; do
            $SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i "$f" -b
          done

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors in CI. A warning nobody fails on is a warning
        # everybody scrolls past.
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: SQL assertion suite — CMS workflow
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/cms_workflow_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::CMS workflow assertions failed"; exit 1; }

      - name: SQL assertion suite — access control
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/access_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Access assertions failed"; exit 1; }

      - name: SQL assertion suite — scheduled publish
        # A deferred publish must obey the same approval rule as an immediate
        # one. It did not, and in a health product that means unreviewed
        # guidance reaching devices unattended.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/scheduled_publish_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Scheduled publish assertions failed"; exit 1; }

      - name: SQL assertion suite — foreign key index coverage
        # Standing invariant: a foreign key added without a supporting index
        # is a scan waiting to happen, and twelve of ours cascade on delete.
        # This is what stops the eighteen fixed in 30_* from coming back.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/index_coverage_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Foreign key index coverage assertions failed"; exit 1; }

      - name: SQL assertion suite — AI safety ledger
        # The companion never diagnoses and never prescribes, and this is the
        # table that shows whether that is still true. It must never be able to
        # hold message content: conversation stays on the device, and one
        # well-meant debugging column would reverse that.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/ai_safety_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::AI safety ledger assertions failed"; exit 1; }

      - name: SQL assertion suite — life stage
        # A transition must preserve history rather than overwrite it. That
        # record is the basis of the companion's longitudinal context and
        # cannot be recovered once a transition has discarded it.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/life_stage_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Life stage assertions failed"; exit 1; }

      - name: SQL assertion suite — content targeting
        # Every failure here is silent: content reaching nobody raises no error,
        # and content reaching the wrong woman raises none either. Assertions
        # are the only thing that catches either one.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/content_targeting_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Content targeting assertions failed"; exit 1; }

      - name: SQL assertion suite — timeline
        # The event store every later engine reads from. Assertion 2 checks the
        # clustered key rather than any behaviour: clustering on a random GUID
        # is invisible in functional tests and is what decides whether this
        # table survives ten million rows.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/timeline_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Timeline assertions failed"; exit 1; }

      - name: SQL assertion suite — knowledge graph
        # Assertions 1 to 5 are the reason this step exists. They check that the
        # graph has not become a diagnostic engine: no causal verb in the
        # relation vocabulary, every edge justified, and health observations
        # flagged so no later engine can score them into advice. The change that
        # adds "causes" will arrive in a hurry and look harmless in review.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/knowledge_graph_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Knowledge graph assertions failed"; exit 1; }

      - name: SQL assertion suite — dashboard engine
        # A dashboard is generated, so the only way to know it is right is to
        # generate one. Assertion 14 is the important one: a suppressed card
        # must disappear rather than rank last, which is the difference between
        # a quiet day and a dashboard that nags.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/dashboard_engine_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Dashboard engine assertions failed"; exit 1; }

      - name: SQL assertion suite — intelligence core
        # Assertions 3 to 6 decide whether this core is honest. A platform that
        # reports a confident state for a woman who logged nothing has reported
        # its own defaults, not her life. No data means no confidence, and no
        # confidence means unknown.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/intelligence_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Intelligence core assertions failed"; exit 1; }

      - name: SQL assertion suite — rule engine
        # Assertion 5 replaces a foreign key. A generic rule table cannot
        # reference its target, so the ON DELETE CASCADE that protected card
        # and content rules is gone; this invariant is what stands in for it,
        # and it caught five orphans on a fresh database the first time.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/rule_engine_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Rule engine assertions failed"; exit 1; }

      - name: SQL assertion suite — decision inspector
        # Assertion 1 is a privacy control, not a feature check: the inspector
        # must never be able to read a real account. It simulates a
        # hypothetical woman, because an inspector that loaded a named user
        # would be impersonation under another name.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/inspector_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Inspector assertions failed"; exit 1; }

      - name: Behaviour assertions
        # Behaviour is the single source of truth every later engine reads
        # without checking, so these cover what those engines assume: a day
        # counted once, a half-finished routine not credited, a measure without
        # enough history absent rather than zero, and no second schema
        # computing any of it.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/behaviour_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Behaviour assertions failed"; exit 1; }

      - name: Goal assertions
        # A goal is a desired outcome, and progress is the distance between what
        # Behaviour observed and what the goal asks for. These cover what a
        # coach, a recommendation and a progress ring all assume: progress from
        # behaviour, never awarded on silence, unknown rather than zero, and
        # achievement earned from the timeline rather than declared by a client.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/growth_goals_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Goal assertions failed"; exit 1; }

      - name: Audit contract assertions
        # Ordering, not compliance. 08_AuditContract.sql applies the contract
        # with a cursor over sys.tables at position 9 of 37, so every table
        # created after it was invisible to that pass. A single ordered run on
        # an empty server left 19 tables short by 147 columns and 19 filtered
        # indexes. It stayed hidden because verification databases had been
        # re-applied more than once. This step runs against what one ordered
        # pass actually produces.
        working-directory: src/Maren.Database
        run: |
          out=$($SQLCMD -C -S localhost -U sa -P "$SA_PASSWORD" -d MarenPlatform -I -i tests/audit_contract_test.sql)
          echo "$out"
          echo "$out" | grep -q "FAILED: 0" || { echo "::error::Audit contract assertions failed"; exit 1; }

      - name: Integration tests
        env:
          ConnectionStrings__MarenPlatform: >-
            Server=localhost,1433;Database=MarenPlatform;User Id=sa;
            Password=${{ secrets.CI_SQL_PASSWORD || 'Local!CI!Passw0rd#2026' }};
            TrustServerCertificate=True;MultipleActiveResultSets=True
        run: >-
          dotnet test tests/Maren.Tests
          --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  security:
    name: Security and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Vulnerable packages
        # Fails the job on any known vulnerability. A report nobody fails on is
        # a report nobody reads.
        run: |
          set -e
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Deprecated packages
        # Reported, not fatal. A deprecation is a plan, not an incident.
        continue-on-error: true
        run: dotnet list package --deprecated --include-transitive

      - name: Check for committed secrets
        # Catches the obvious cases before they reach history, where removing
        # them means a force-push and rotating whatever leaked.
        run: |
          set -e
          # appsettings.Development.json is committed deliberately and holds
          # only LocalDB plus a key named as dev-only.
          if git grep -nIE "(password|pwd|secret|apikey|api_key)\s*[=:]\s*[\"'][^\"']{8,}" \
               -- ':!*.md' ':!**/appsettings.Development.json' | grep -viE "placeholder|example|your-|<.*>|dev-only"; then
            echo "::error::Possible committed secret"
            exit 1
          fi
          echo "No obvious secrets found"
