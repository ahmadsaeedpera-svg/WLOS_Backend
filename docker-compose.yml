# Brings up the platform and its database together, so a new developer needs
# Docker and nothing else. Development values only — production configuration
# comes from the environment or a secret store.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local!Dev!Passw0rd#2026}
      MSSQL_PID: Developer
    ports:
      - '1433:1433'
    volumes:
      - maren-db:/var/opt/mssql
    healthcheck:
      # The API must not start before the database answers, or it fails its
      # first readiness probe and the orchestrator restarts it pointlessly.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '5199:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MarenPlatform: >-
        Server=db,1433;Database=MarenPlatform;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:-Local!Dev!Passw0rd#2026};
        TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-not-for-production-use-32chars}
      Jwt__Issuer: maren.platform
      Jwt__Audience: maren.app
      Cors__AdminPortalOrigins__0: http://localhost:5173
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health/live || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  maren-db:
